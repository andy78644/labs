# Flight Watch config. Edit this file to change what gets scanned.
# Airport codes are IATA codes (TPE = Taoyuan, TSA = Songshan, NRT/HND = Tokyo, ...).

origin: TPE
currency: TWD
language: zh-TW          # language Google Flights answers in (airline names)

search:
  trip: round-trip       # round-trip | one-way
  stay_nights: [4]       # one or more trip lengths; each one is a separate query
  depart_weekdays: [fri] # which departure days to sample (mon..sun)
  window_days: [14, 90]  # only departures 14-90 days from today
  max_stops: 1           # null = any
  adults: 1
  delay_seconds: 2       # pause between requests to stay polite

# Routes live in data/watchlist.json so the settings page (settings.html) can
# edit them. Routes listed here are scanned too, but the page can't change them.
# A route can override any `search` key, e.g. stay_nights or dates.
routes: []

alerts:
  drop_pct: 15           # alert when a fare is this % below its recent median
  baseline_days: 30      # how far back the median looks
  min_samples: 6         # need this many past scans before drop alerts start

promotions:
  enabled: true
  lookback_days: 14
  # Searched on Google News once per route name, e.g. "機票 優惠 東京".
  query_terms: [機票, 優惠]
  # Extra RSS/Atom feeds. Items are kept when the title mentions a route
  # name and one of `keywords`.
  feeds: []
  keywords: [優惠, 促銷, 特價, 買一送一, 早鳥, 限時, 開賣, 開搶, 折, sale]
  require_any: [機票, 航空, 航線, 票價, 來回]  # must look like an airfare story
  # drop giveaways and Hong Kong-origin fares, which show up in zh results
  exclude: [抽獎, 抽, 港幣, 香港出發, 香港快運, HK Express, 連稅]

notify:
  dashboard_url: https://andy78644.com/labs/flight-watch/   # linked at the end of every message
  price_changes: true    # report a route when its cheapest fare moves...
  min_change_pct: 3      # ...at least this much since the last report
  daily_summary: true    # one message a day listing every route's cheapest fare
  summary_hour: 8        # sent by the first scan after this hour (scans run ~08:17, 14:17, 20:17, 02:17)
  timezone: Asia/Taipei

history_days: 180        # older scans are pruned from data/history.json
