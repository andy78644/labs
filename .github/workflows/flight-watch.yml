name: Flight Watch scan

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:
    inputs:
      test_notify:
        description: "只發一則測試通知，不掃描"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write   # pushes made with GITHUB_TOKEN don't rebuild Pages, so request a build

concurrency:
  group: flight-watch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: flight-watch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: flight-watch/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest
      - name: Send a test notification
        if: inputs.test_notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m scanner.notify
      - name: Scan fares and promotions
        if: ${{ !inputs.test_notify }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DASHBOARD_URL: ${{ vars.FLIGHT_WATCH_DASHBOARD_URL }}
        run: python -m scanner.scan
      - name: Commit data
        id: commit
        if: ${{ always() && !inputs.test_notify }}
        run: |
          git config user.name "flight-watch[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "flight-watch: scan $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            if git pull --rebase && git push; then echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 5
          done
          exit 1
      - name: Rebuild GitHub Pages
        if: always() && steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent
